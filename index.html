<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TUK IA · Encuesta</title>
<meta name="description" content="Encuesta anónima de 2 minutos para decidir cómo será TUK IA, la IA que funciona sin internet.">
<meta name="theme-color" content="#F5F0E6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='10' y='14' width='100' height='72' rx='30' fill='%23127A64'/%3E%3Cpath d='M28 76 L16 104 L52 84 Z' fill='%23127A64'/%3E%3Cpath d='M36 52 L84 32 L66 72 L58 58 Z' fill='%23F5F0E6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@600;700;800&family=Caveat:wght@700&display=swap">
<style>
  :root { --tinta: #14181F; --papel: #F5F0E6; --maiz: #F2B33D; --jade: #127A64; --gris: #5B6466; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { font-family: Manrope, system-ui, sans-serif; color: var(--tinta); background-color: var(--papel);
    background-image: linear-gradient(90deg, transparent 0 34px, rgba(229,72,77,0.4) 34px 36px, transparent 36px),
                      repeating-linear-gradient(transparent 0 33px, rgba(60,110,190,0.16) 33px 35px); }
  main { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 20px 40px 52px; min-height: 100dvh; display: flex; flex-direction: column; }
  .arriba { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .marca { display: flex; align-items: center; gap: 8px; font: 800 26px "Bricolage Grotesque"; letter-spacing: -0.03em; }
  .marca b { font: 800 12px Manrope; background: var(--maiz); border-radius: 99px; padding: 3px 9px; }
  .barra { height: 8px; background: rgba(20,24,31,0.08); border-radius: 99px; overflow: hidden; margin-bottom: 26px; }
  .barra i { display: block; height: 100%; width: 0; background: var(--jade); border-radius: 99px; transition: width .3s; }
  h1 { font: 800 clamp(34px, 9vw, 46px)/0.98 "Bricolage Grotesque"; letter-spacing: -0.04em; margin-bottom: 14px; }
  h2 { font: 800 clamp(25px, 6.5vw, 32px)/1.05 "Bricolage Grotesque"; letter-spacing: -0.03em; margin-bottom: 8px; }
  .mk { background: linear-gradient(transparent 55%, var(--maiz) 55% 92%, transparent 92%); }
  p { font: 600 17px/1.45 Manrope; color: #2E3439; margin-bottom: 16px; }
  .nota { font: 700 14px/1.4 Manrope; color: var(--gris); }
  .mano { font: 700 24px Caveat; color: var(--jade); }
  .opciones { display: grid; gap: 10px; margin: 14px 0 18px; }
  .op { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 15px 16px; border-radius: 16px; border: 2px solid rgba(20,24,31,0.12);
    background: #fff; font: 700 17px/1.3 Manrope; color: var(--tinta); cursor: pointer; box-shadow: 0 3px 10px rgba(20,24,31,0.06); }
  .op .c { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid rgba(20,24,31,0.35); display: grid; place-items: center; font-size: 14px; }
  .op.redondo .c { border-radius: 50%; }
  .op.si { border-color: var(--jade); background: #E8F3EF; }
  .op.si .c { background: var(--jade); border-color: var(--jade); color: #fff; }
  .escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0 6px; }
  .escala .op { justify-content: center; font: 800 22px "Bricolage Grotesque"; padding: 16px 0; }
  .extremos { display: flex; justify-content: space-between; font: 700 13px Manrope; color: var(--gris); margin-bottom: 18px; }
  textarea, input[type=text] { width: 100%; border-radius: 16px; border: 2px solid rgba(20,24,31,0.15); background: #fff; padding: 14px 16px; font: 600 17px Manrope; color: var(--tinta); resize: vertical; margin: 12px 0 18px; }
  .botones { display: flex; gap: 10px; margin-top: auto; padding-top: 10px; }
  button.seguir, a.seguir { flex: 1; border: 0; border-radius: 99px; padding: 17px 20px; background: var(--tinta); color: var(--papel); font: 800 18px Manrope; cursor: pointer; text-align: center; text-decoration: none; }
  button.seguir:disabled { opacity: 0.35; cursor: default; }
  button.atras { border: 2px solid rgba(20,24,31,0.2); background: transparent; border-radius: 99px; padding: 15px 18px; font: 800 16px Manrope; color: var(--tinta); cursor: pointer; }
  .maiz { background: var(--maiz) !important; color: var(--tinta) !important; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 18px; }
  .chips span { background: #fff; border-radius: 99px; padding: 6px 12px; font: 800 14px Manrope; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .oculto { display: none !important; }
  .trampa { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <div class="arriba">
    <div class="marca"><svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true"><rect x="10" y="14" width="100" height="72" rx="30" fill="#127A64"/><path d="M28 76 L16 104 L52 84 Z" fill="#127A64"/><path d="M36 52 L84 32 L66 72 L58 58 Z" fill="#F5F0E6"/></svg>tuk <b>IA</b></div>
    <span class="nota" id="contador"></span>
  </div>
  <div class="barra" aria-hidden="true"><i id="avance"></i></div>
  <section id="paso"></section>
</main>
<script src="config.js"></script>
<script>
// Encuesta de TUK IA: una pregunta por pantalla, anónima. Las respuestas se mandan a la hoja de Google
// de Carlos (window.TUK_ENDPOINT en config.js). No guarda nombre, correo ni teléfono.
const PREGUNTAS = [
  { id: "rol", tipo: "una", titulo: "¿Qué eres?", ops: ["Estudiante de prepa", "Estudiante de universidad", "Maestro(a)", "Trabajo", "Otro"] },
  { id: "frecuencia", tipo: "una", titulo: "¿Qué tan seguido usas IA?", sub: "ChatGPT, Gemini, Meta AI…", ops: ["Diario", "Varias veces por semana", "A veces", "Casi nunca", "Nunca"] },
  { id: "usos", tipo: "varias", titulo: "¿Para qué la usas más?", sub: "Puedes elegir varias.", ops: ["Tareas y estudiar", "Traducir o idiomas", "Escribir textos", "Programar", "Trabajo", "Dudas del día a día", "Temas personales", "No la uso"] },
  { id: "problemas", tipo: "varias", titulo: "¿Te ha pasado alguna de estas?", sub: "Puedes elegir varias.", ops: ["Me quedé sin datos o sin señal y no pude usarla", "Se cayó o no respondía", "Me topé con el límite de mensajes", "No la dejan usar en clase o en el examen", "Me dio pena o miedo preguntarle algo personal", "Nunca me ha pasado"] },
  { id: "privacidad", tipo: "escala", titulo: "¿Qué tanto te preocupa que la IA guarde lo que le preguntas?", izq: "Nada", der: "Muchísimo" },
  { id: "usaria", tipo: "una", titulo: "TUK IA funciona dentro de tu celular, sin internet y sin mandar nada a la nube. ¿La usarías?", ops: ["Sí, seguro", "Tal vez", "No"] },
  { id: "camino", tipo: "una", titulo: "¿Para qué la usarías PRIMERO?", sub: "Elige una.", ops: ["Estudiar: que me explique mis apuntes y me prepare para exámenes", "Respaldo: tener IA cuando no hay internet o falla la mía", "Privacidad: preguntar cosas sin que nadie más las vea", "Algo especial (lo escribes en la siguiente)"] },
  { id: "especial", tipo: "texto", corto: true, titulo: "¿En qué te gustaría que fuera experta?", sub: "Opcional. Por ejemplo: idiomas, programación, salud, finanzas, música…", opcional: true },
  { id: "celular", tipo: "una", titulo: "¿Qué celular tienes?", ops: ["iPhone", "Android", "Otro / no tengo"] },
  { id: "pago", tipo: "una", titulo: "Si tuviera una versión con más funciones, ¿cuánto pagarías al mes?", ops: ["Nada, solo la usaría gratis", "$29", "$49", "$79", "Más de $79"] },
  { id: "sugerencia", tipo: "texto", titulo: "¿Qué tendría que tener para que la uses diario?", sub: "Opcional.", opcional: true },
];
const respuestas = {};
let i = -1;   // -1 = portada
const $ = (s) => document.querySelector(s);
const escapar = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let yaRespondio = false;
try { yaRespondio = localStorage.getItem("tuk-encuesta-1") === "si"; } catch {}

function pintar() {
  const caja = $("#paso");
  $("#avance").style.width = i < 0 ? "0%" : `${Math.round((i / PREGUNTAS.length) * 100)}%`;
  $("#contador").textContent = i >= 0 && i < PREGUNTAS.length ? `${i + 1} de ${PREGUNTAS.length}` : "";
  if (i < 0) {
    caja.innerHTML = `
      <h1>¿Tu IA funciona <span class="mk">sin internet?</span></h1>
      <p>Estamos creando <b>TUK IA</b>, una IA que vive en tu celular: te explica tus apuntes y te prepara para el examen, aunque no tengas datos. Ayúdanos a decidir cómo será.</p>
      <div class="chips"><span>⏱ 2 minutos</span><span>🔒 Anónima</span><span>📱 ${PREGUNTAS.length} preguntas</span></div>
      <p class="nota">No pedimos tu nombre, correo ni teléfono. Las respuestas solo se usan, en conjunto, para diseñar la app.</p>
      ${yaRespondio ? '<p class="mano">Ya respondiste en este celular. ¡Gracias! Si quieres, puedes contestar otra vez.</p>' : ""}
      <div class="botones"><button class="seguir maiz" id="empezar">Empezar</button></div>`;
    $("#empezar").onclick = () => { i = 0; pintar(); };
    return;
  }
  if (i >= PREGUNTAS.length) return final();
  const q = PREGUNTAS[i];
  let cuerpo = "";
  if (q.tipo === "una" || q.tipo === "varias") {
    const sel = respuestas[q.id] || (q.tipo === "varias" ? [] : "");
    cuerpo = `<div class="opciones">${q.ops.map((o, k) => {
      const si = q.tipo === "varias" ? sel.includes(o) : sel === o;
      return `<button class="op ${q.tipo === "una" ? "redondo" : ""} ${si ? "si" : ""}" data-k="${k}"><span class="c">${si ? "✓" : ""}</span>${escapar(o)}</button>`;
    }).join("")}</div>`;
  } else if (q.tipo === "escala") {
    cuerpo = `<div class="escala">${[1, 2, 3, 4, 5].map((n) => `<button class="op ${respuestas[q.id] === n ? "si" : ""}" data-n="${n}">${n}</button>`).join("")}</div>
      <div class="extremos"><span>1 · ${q.izq}</span><span>5 · ${q.der}</span></div>`;
  } else {
    cuerpo = q.corto ? `<input type="text" id="texto" maxlength="120" value="${escapar(respuestas[q.id] || "")}">`
                     : `<textarea id="texto" rows="4" maxlength="500">${escapar(respuestas[q.id] || "")}</textarea>`;
  }
  const ultima = i === PREGUNTAS.length - 1;
  caja.innerHTML = `<h2>${escapar(q.titulo)}</h2>${q.sub ? `<p class="nota">${escapar(q.sub)}</p>` : ""}${cuerpo}
    <input class="trampa" id="trampa" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="botones"><button class="atras" id="atras">←</button><button class="seguir ${ultima ? "maiz" : ""}" id="seguir">${ultima ? "Enviar" : "Seguir"}</button></div>`;
  const seguir = $("#seguir");
  const listo = () => q.opcional || (q.tipo === "varias" ? (respuestas[q.id] || []).length > 0 : !!respuestas[q.id]);
  seguir.disabled = !listo();
  caja.querySelectorAll(".op").forEach((b) => b.onclick = () => {
    if (q.tipo === "escala") respuestas[q.id] = Number(b.dataset.n);
    else if (q.tipo === "una") respuestas[q.id] = q.ops[b.dataset.k];
    else {
      const o = q.ops[b.dataset.k], arr = respuestas[q.id] || [];
      respuestas[q.id] = arr.includes(o) ? arr.filter((x) => x !== o) : [...arr, o];
    }
    pintar();
    if (q.tipo !== "varias") setTimeout(() => { if (PREGUNTAS[i] === q) avanzar(); }, 220);
  });
  const texto = $("#texto");
  if (texto) texto.oninput = () => { respuestas[q.id] = texto.value.trim(); };
  $("#atras").onclick = () => { i -= 1; pintar(); };
  seguir.onclick = avanzar;
}
function avanzar() {
  const q = PREGUNTAS[i];
  // si no eligió «algo especial», se salta la pregunta de especialidad
  i += 1;
  if (PREGUNTAS[i] && PREGUNTAS[i].id === "especial" && !(respuestas.camino || "").startsWith("Algo especial")) i += 1;
  if (i >= PREGUNTAS.length) enviar(); else pintar();
}
async function enviar() {
  const trampa = (document.getElementById("trampa") || {}).value || "";
  $("#paso").innerHTML = `<h2>Enviando…</h2>`;
  const datos = { ...respuestas, version: 1, origen: new URLSearchParams(location.search).get("de") || "qr" };
  let ok = true;
  if (trampa) ok = true;  // un robot llenó el campo oculto: no se manda nada
  else if (window.TUK_ENDPOINT) {
    try { await fetch(window.TUK_ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(datos) }); }
    catch { ok = false; }
  } else ok = false;
  if (ok) { try { localStorage.setItem("tuk-encuesta-1", "si"); } catch {} }
  i = PREGUNTAS.length;
  final(ok);
}
function final(ok = true) {
  $("#avance").style.width = "100%";
  $("#contador").textContent = "";
  $("#paso").innerHTML = ok ? `
      <h1>¡Gracias! <span class="mk">Ya eres parte de TUK.</span></h1>
      <p>Con tus respuestas vamos a decidir cómo será la app.</p>
      <p class="mano">¿Quieres probarla antes que nadie?</p>
      <p>Manda <b>«TUK»</b> por mensaje a <b>@i4_tu_k</b> en Instagram.</p>
      <div class="botones"><a class="seguir maiz" href="https://ig.me/m/i4_tu_k">Mandar «TUK»</a></div>`
    : `<h2>No se pudo enviar 😕</h2><p>Revisa tu conexión e inténtalo otra vez.</p>
      <div class="botones"><button class="seguir" id="reintentar">Reintentar</button></div>`;
  const r = document.getElementById("reintentar");
  if (r) r.onclick = enviar;
}
pintar();
</script>
</body>
</html>
